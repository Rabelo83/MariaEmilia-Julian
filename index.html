<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Todo lo Cosechado · 54 Aniversario</title>

<!-- Social / GitHub thumbnail -->
<meta property="og:title"       content="Todo lo Cosechado — 54 Aniversario · Julián &amp; María Emilia">
<meta property="og:description" content="Una canción de amor para conmemorar 54 años juntos.">
<meta property="og:image"       content="https://rabelo83.github.io/MariaEmilia-Julian/16-54-aniversario.jpeg">
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://rabelo83.github.io/MariaEmilia-Julian/">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:image"      content="https://rabelo83.github.io/MariaEmilia-Julian/16-54-aniversario.jpeg">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@200;300;400&display=swap" rel="stylesheet">
<style>

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESET
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Lato',sans-serif;color:#f5e6c8;
  -webkit-font-smoothing:antialiased;touch-action:pan-y}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   KEN BURNS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@keyframes kb1{0%{transform:scale(1)   translate(0,0)}      100%{transform:scale(1.10)translate(-1.5%, .5%)}}
@keyframes kb2{0%{transform:scale(1)   translate(0,0)}      100%{transform:scale(1.10)translate( 1.5%,-.5%)}}
@keyframes kb3{0%{transform:scale(1.08)translate(-1%,0)}    100%{transform:scale(1.16)translate( 1%,0)}}
@keyframes kb4{0%{transform:scale(1.12)translate(0,-.5%)}   100%{transform:scale(1.02)translate( 0, .5%)}}
@keyframes kb5{0%{transform:scale(1)   translate(1.5%,-1%)} 100%{transform:scale(1.12)translate(-1%, 1%)}}
@keyframes kb6{0%{transform:scale(1.1) translate(0, 1%)}    100%{transform:scale(1.02)translate( 0,-1%)}}
@keyframes kbCard{0%{transform:scale(.97)}100%{transform:scale(1.03)}}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   SLIDESHOW
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#slideshow{position:fixed;inset:0;z-index:0}
.slide{position:absolute;inset:0;opacity:0;overflow:hidden;transition:opacity 2.4s ease-in-out}
.slide.active{opacity:1;z-index:2}
.slide-blur{position:absolute;inset:-6%;background-size:cover;background-position:center;
  filter:blur(32px) brightness(.28) saturate(1.6);transform:scale(1.1);will-change:transform}
.slide-photo{position:absolute;inset:0;background-repeat:no-repeat;will-change:transform}
.slide-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 40%,rgba(0,0,0,.42)100%)}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   GLOBAL OVERLAYS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#gradient-overlay{position:fixed;inset:0;z-index:10;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(0,0,0,.28) 0%,transparent 25%,
    transparent 42%,rgba(0,0,0,.60) 70%,rgba(0,0,0,.96)100%)}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   PROGRESS BAR
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#progress-bar{position:fixed;top:0;left:0;height:2px;z-index:60;width:0%;
  background:linear-gradient(90deg,#c89a30,#f0c060,#c89a30);
  transition:width .6s linear;box-shadow:0 0 8px rgba(240,192,96,.5)}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HEADER
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#header{position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(env(safe-area-inset-top,0px)+16px) clamp(16px,4vw,36px) 0;
  display:flex;align-items:center;justify-content:space-between}
#title-text{font-family:'Cormorant Garamond',serif;font-size:clamp(.78rem,1.6vw,1.3rem);
  font-weight:300;letter-spacing:.06em;color:rgba(245,230,200,.55);
  text-shadow:0 1px 10px rgba(0,0,0,1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:12px}
#title-text em{font-style:italic;color:rgba(240,192,96,.85);font-weight:400}

/* play button */
#play-btn{min-width:44px;width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(240,192,96,.35);background:rgba(240,192,96,.07);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:background .3s,border-color .3s,transform .2s;
  -webkit-tap-highlight-color:transparent}
#play-btn:hover,#play-btn:active{background:rgba(240,192,96,.2);
  border-color:rgba(240,192,96,.65);transform:scale(1.1)}
#play-btn svg{width:17px;height:17px;fill:#f0c060}

/* era badge */
#era-badge{position:fixed;left:clamp(16px,4vw,36px);z-index:40;
  font-size:clamp(.58rem,1.1vw,.68rem);font-weight:300;letter-spacing:.26em;
  text-transform:uppercase;color:rgba(240,192,96,.65);
  text-shadow:0 1px 8px rgba(0,0,0,1);
  transition:opacity .6s ease,transform .6s ease}
#era-badge.fade-out{opacity:0;transform:translateX(-10px)}
#era-badge.fade-in {opacity:1;transform:translateX(0)}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   KARAOKE WINDOW
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#karaoke{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  transition:opacity 1s ease;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 clamp(12px,9vw,160px) calc(env(safe-area-inset-bottom,0px)+28px);
  gap:clamp(2px,0.6vh,6px);
  pointer-events:none;
}

.kline{
  display:block;width:100%;text-align:center;
  font-family:'Cormorant Garamond',serif;
  font-weight:300;letter-spacing:.015em;
  transition:opacity .5s ease,transform .5s ease,font-size .4s ease;
}

/* past lines */
.kline[data-state="past-2"]{font-size:clamp(.72rem,1.4vw,1rem);  opacity:.28;transform:scale(.90)}
.kline[data-state="past-1"]{font-size:clamp(.82rem,1.6vw,1.15rem);opacity:.50;transform:scale(.94)}

/* current line — gold sweep */
.kline[data-state="current"]{
  font-size:clamp(1.05rem,2.4vw,1.85rem);
  font-weight:400;opacity:1;transform:scale(1);
}
.kline[data-state="current"] .ktext{
  /* gradient: gold on left up to --fill, cream on right */
  background:linear-gradient(to right,
    #f0c060 var(--fill,0%),
    rgba(245,230,200,.95) var(--fill,0%));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 10px rgba(240,192,96,.35));
}
/* refrain lines glow even when not current */
.kline[data-state="current"].refrain .ktext{
  filter:drop-shadow(0 0 16px rgba(240,192,96,.55));
}

/* future lines */
.kline[data-state="next-1"]{font-size:clamp(.82rem,1.6vw,1.15rem);opacity:.40;transform:scale(.94)}
.kline[data-state="next-2"]{font-size:clamp(.72rem,1.4vw,1rem);  opacity:.22;transform:scale(.90)}
.kline[data-state="hidden"]{opacity:0;transform:scale(.88);font-size:clamp(.72rem,1.4vw,1rem)}

/* text shadow on non-current lines */
.kline:not([data-state="current"]) .ktext{
  color:rgba(245,230,200,1);
  text-shadow:0 1px 6px rgba(0,0,0,1),0 2px 20px rgba(0,0,0,.8);
}

/* ── DOTS ── */
#dots{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+10px);
  left:50%;transform:translateX(-50%);
  display:flex;gap:5px;z-index:45}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18);transition:.5s}
.dot.active{background:rgba(240,192,96,.9);transform:scale(1.6)}

#counter{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+38px);
  right:clamp(16px,4vw,36px);z-index:45;
  font-size:.65rem;font-weight:200;letter-spacing:.12em;color:rgba(245,230,200,.25)}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CALIBRATION OVERLAY
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#calib-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.88);
  flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(20px,5vw,60px);overflow-y:auto
}
#calib-overlay.active{display:flex}
#calib-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.2rem,3vw,2rem);
  color:#f0c060;margin-bottom:6px;text-align:center}
#calib-sub{font-size:.78rem;font-weight:300;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(245,230,200,.5);margin-bottom:28px;text-align:center}
#calib-current{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,2.5vw,1.8rem);
  color:#f5e6c8;text-align:center;margin-bottom:6px;min-height:2em;display:flex;align-items:center;justify-content:center}
#calib-next{font-size:clamp(.8rem,1.6vw,1.1rem);color:rgba(245,230,200,.45);text-align:center;margin-bottom:28px;min-height:1.5em}
#calib-tap{background:rgba(240,192,96,.12);border:1px solid rgba(240,192,96,.4);border-radius:2px;
  padding:14px 48px;font-family:'Lato',sans-serif;font-size:.8rem;letter-spacing:.25em;
  text-transform:uppercase;color:#f0c060;cursor:pointer;margin-bottom:16px;
  transition:background .2s;-webkit-tap-highlight-color:transparent;min-height:52px}
#calib-tap:hover,#calib-tap:active{background:rgba(240,192,96,.22)}
#calib-progress{font-size:.72rem;color:rgba(245,230,200,.35);letter-spacing:.15em;margin-bottom:28px}
#calib-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.calib-btn{background:transparent;border:1px solid rgba(245,230,200,.2);border-radius:2px;
  padding:10px 28px;font-family:'Lato',sans-serif;font-size:.72rem;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(245,230,200,.5);cursor:pointer;
  transition:background .2s,color .2s;-webkit-tap-highlight-color:transparent;min-height:44px}
.calib-btn:hover{background:rgba(245,230,200,.08);color:rgba(245,230,200,.85)}
#calib-hint{margin-top:20px;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(245,230,200,.25);text-align:center}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   START SCREEN
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#start-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;overflow:hidden;
  transition:opacity 1.4s ease;padding:clamp(24px,6vw,60px)}
#start-screen.hidden{opacity:0;pointer-events:none}
#start-bg{position:absolute;inset:-4%;
  background-image:url("10-escalera-juntos.jpeg");
  background-size:cover;background-position:center 12%;
  filter:brightness(.22) blur(3px) saturate(1.2);transform:scale(1.05)}
#start-screen::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(240,192,96,.3),transparent)}
#start-content{position:relative;z-index:2;max-width:600px;width:100%}
.start-eyebrow{font-size:clamp(.62rem,1.2vw,.82rem);font-weight:200;letter-spacing:.42em;
  text-transform:uppercase;color:rgba(240,192,96,.55);margin-bottom:clamp(12px,2.5vh,20px)}
#start-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,9vw,6rem);
  font-weight:300;line-height:1.0;color:#f5e6c8;text-shadow:0 4px 40px rgba(0,0,0,.5);margin-bottom:8px}
#start-subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(1.1rem,3.5vw,2.2rem);font-weight:300;color:#f0c060;letter-spacing:.04em}
.start-divider{width:1px;height:clamp(32px,6vh,52px);
  background:linear-gradient(to bottom,transparent,rgba(240,192,96,.4),transparent);
  margin:clamp(16px,3vh,24px) auto}
.start-year-block{font-size:clamp(.72rem,1.4vw,.92rem);font-weight:200;letter-spacing:.3em;
  color:rgba(245,230,200,.3);margin-bottom:clamp(28px,5vh,44px)}
.start-year-block strong{font-weight:300;color:rgba(245,230,200,.5)}
#start-btn{display:inline-flex;align-items:center;gap:10px;background:transparent;
  border:1px solid rgba(240,192,96,.4);border-radius:2px;
  padding:clamp(12px,2vh,14px) clamp(28px,6vw,48px);
  font-family:'Lato',sans-serif;font-size:clamp(.7rem,1.3vw,.78rem);
  font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:rgba(240,192,96,.8);
  cursor:pointer;transition:background .35s,border-color .35s,color .35s,transform .2s;
  -webkit-tap-highlight-color:transparent;min-height:52px}
#start-btn:hover,#start-btn:active{background:rgba(240,192,96,.1);
  border-color:rgba(240,192,96,.7);color:#f0c060}
.start-heart{display:block;margin:0 auto clamp(14px,3vh,24px);font-size:clamp(1.3rem,3vw,1.8rem);
  line-height:1;color:#c0392b;filter:drop-shadow(0 0 10px rgba(192,57,43,.5));
  animation:heartbeat 2.6s infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}38%{transform:scale(1.14)}60%{transform:scale(1)}}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   FINALE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#finale{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0);transition:background 1.5s ease}
#finale.active{display:flex;background:rgba(0,0,0,.7)}
#finale-img{max-height:85vh;max-width:85vw;object-fit:contain;
  opacity:0;transform:scale(.92);transition:opacity 1.4s ease,transform 1.4s ease}
#finale.active #finale-img{opacity:1;transform:scale(1)}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MOBILE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@media(max-width:500px){
  #era-badge{display:none}
  #dots,#counter{display:none}
  #karaoke{padding-left:10px;padding-right:10px}
}
@media(max-width:768px) and (orientation:landscape){
  .kline[data-state="current"]{font-size:.95rem}
  .kline[data-state="past-1"],.kline[data-state="next-1"]{font-size:.78rem}
  .kline[data-state="past-2"],.kline[data-state="next-2"]{font-size:.68rem}
}

</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="gradient-overlay"></div>

<!-- ══ START ════════════════════════════════════════ -->
<div id="start-screen">
  <div id="start-bg"></div>
  <div id="start-content">
    <span class="start-heart">♥</span>
    <div class="start-eyebrow">Julián &amp; María Emilia</div>
    <div id="start-title">Todo lo cosechado</div>
    <div id="start-subtitle">54 Aniversario</div>
    <div class="start-divider"></div>
    <div class="start-year-block"><strong>1972</strong>&nbsp;—&nbsp;<strong>2026</strong></div>
    <button id="start-btn" onclick="startPresentation()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Comenzar
    </button>
  </div>
</div>

<!-- ══ SLIDESHOW ════════════════════════════════════ -->
<div id="slideshow"></div>

<!-- ══ HEADER ══════════════════════════════════════ -->
<div id="header">
  <div id="title-text"><em>Todo lo cosechado</em>&nbsp;·&nbsp;Julián &amp; María Emilia</div>
  <div id="play-btn" onclick="toggleAudio(event)">
    <svg viewBox="0 0 24 24"><path id="play-path" d="M8 5v14l11-7z"/></svg>
  </div>
</div>
<div id="era-badge" class="fade-in"></div>

<!-- ══ KARAOKE ══════════════════════════════════════ -->
<div id="karaoke">
  <div class="kline" data-state="hidden"><span class="ktext">&nbsp;</span></div>
  <div class="kline" data-state="hidden"><span class="ktext">&nbsp;</span></div>

<!-- ══ DOTS / COUNTER ══════════════════════════════ -->
<div id="dots"></div>

<!-- ══ CALIBRATION ═════════════════════════════════ -->
<div id="calib-overlay">

  <div id="calib-sub">Pulsa el botón cuando comienza cada línea</div>
  <div id="calib-current">—</div>
  <div id="calib-next"></div>
  <button id="calib-tap" onclick="calibTap()">▶ &nbsp; Esta línea empieza ahora</button>
  <div id="calib-progress">0 / 0</div>
  <div id="calib-actions">
    <button class="calib-btn" onclick="calibRestart()">↺ &nbsp; Reiniciar</button>
    <button class="calib-btn" onclick="calibSave()">✓ &nbsp; Guardar y salir</button>
    <button class="calib-btn" onclick="calibCancel()">✕ &nbsp; Cancelar</button>
  </div>
  <div id="calib-hint">Tecla C para abrir / cerrar · Espacio = tap</div>
</div>

<div id="finale">

<!-- ═══════════════════════════════════════════════════════
     SCRIPT
════════════════════════════════════════════════════════ -->
<script>
/* ──────────────────────────────────────────────────────

const photos=[

/* ──────────────────────────────────────────────────────

──────────────────────────────────────────────────────*/
const lines=[
  // Verse 1
  {t:0,  v:0,r:false,txt:"María Emilia y yo, somos"},
  {t:0,  v:0,r:false,txt:"De un poema, dos versos,"},
  {t:0,  v:0,r:false,txt:"Somos portadas, reversos"},
  {t:0,  v:0,r:false,txt:"De libros en varios tomos."},
  {t:0,  v:0,r:false,txt:"Somos tapa, somos pomos"},
  {t:0,  v:0,r:false,txt:"de todo lo elaborado,"},
  {t:0,  v:0,r:false,txt:"Como un cofre resguardado"},
  {t:0,  v:0,r:false,txt:"Con amor bien protegido,"},
  {t:0,  v:0,r:true, txt:"Con amor se ha recogido,"},
  {t:0,  v:0,r:true, txt:"Todo lo cosechado."},
  // Verse 2
  {t:0,  v:1,r:false,txt:"Somos polos diferentes"},
  {t:0,  v:1,r:false,txt:"Por ello, hay atracción"},
  {t:0,  v:1,r:false,txt:"Somos acción, reacción"},
  {t:0,  v:1,r:false,txt:"Somos dos conectadas mentes."},
  {t:0,  v:1,r:false,txt:"Somos dos almas pacientes"},
  {t:0,  v:1,r:false,txt:"Orgullosas de un pasado"},
  {t:0,  v:1,r:false,txt:"Que con el amor pactado"},
  {t:0,  v:1,r:false,txt:"En aquel día elegido"},
  {t:0,  v:1,r:true, txt:"Con amor se ha recogido"},
  {t:0,  v:1,r:true, txt:"Todo lo cosechado."},
  // Verse 3
  {t:0,  v:2,r:false,txt:"Somos las alas en par"},
  {t:0,  v:2,r:false,txt:"Sosteniendo un corazón"},
  {t:0,  v:2,r:false,txt:"Componemos la razón,"},
  {t:0,  v:2,r:false,txt:"De una generación crear."},
  {t:0,  v:2,r:false,txt:"Tronco y rama, nuevo hogar"},
  {t:0,  v:2,r:false,txt:"Que nació en el pasado"},
  {t:0,  v:2,r:false,txt:"Riberas y un río dado"},
  {t:0,  v:2,r:false,txt:"En un largo recorrido"},
  {t:0,  v:2,r:true, txt:"Con amor se ha recogido"},
  {t:0,  v:2,r:true, txt:"Todo lo cosechado."},
  // Verse 4
  {t:0,  v:3,r:false,txt:"Agua dulce, agua salada"},
  {t:0,  v:3,r:false,txt:"En el umbral de la unión"},
  {t:0,  v:3,r:false,txt:"Salvando la situación,"},
  {t:0,  v:3,r:false,txt:"A veces, tan complicada."},
  {t:0,  v:3,r:false,txt:"Experiencia acumulada"},
  {t:0,  v:3,r:false,txt:"En eventos del pasado,"},
  {t:0,  v:3,r:false,txt:"Hoy, aquí hemos llegado"},
  {t:0,  v:3,r:false,txt:"Recordando lo vivido"},
  {t:0,  v:3,r:true, txt:"Con amor se ha recogido"},
  {t:0,  v:3,r:true, txt:"Todo lo cosechado."},
  // Verse 5
  {t:0,  v:4,r:false,txt:"Gracias a Dios, por la vida"},
  {t:0,  v:4,r:false,txt:"Que juntos hemos vivido"},
  {t:0,  v:4,r:false,txt:"Gracias a Dios, por Cupido"},
  {t:0,  v:4,r:false,txt:"Del flechazo y la herida."},
  {t:0,  v:4,r:false,txt:"Gracias por la bendecida"},
  {t:0,  v:4,r:false,txt:"Familia que hemos creado"},
  {t:0,  v:4,r:false,txt:"Gracias por haber llegado"},
  {t:0,  v:4,r:false,txt:"A otro año más, cumplido"},
  {t:0,  v:4,r:true, txt:"Con amor se ha recogido"},
  {t:0,  v:4,r:true, txt:"Todo lo cosechado."},
];

/* ──────────────────────────────────────────────────────
   DEFAULT TIMING (seconds) — estimated for ~5:09 song
   User can override via Calibration mode (saves to localStorage)
──────────────────────────────────────────────────────*/
const DEFAULT_TIMES=[
  /* V1 */ 19.0,23.5,28.0,32.5,37.0,41.5,46.0,50.5,55.0,62.0,
  /* V2 */ 72.0,76.5,81.0,85.5,90.0,94.5,99.0,103.5,108.0,115.0,
  /* V3 */125.0,129.5,134.0,138.5,143.0,147.5,152.0,156.5,161.0,168.0,
  /* V4 */178.0,182.5,187.0,191.5,196.0,200.5,205.0,209.5,214.0,221.0,
  /* V5 */231.0,235.5,240.0,244.5,249.0,253.5,258.0,262.5,267.0,274.0,
];

/* Load saved times from localStorage if available */
function loadTimes(){
  try{
    const s=localStorage.getItem('kara_times');
    if(s){const arr=JSON.parse(s);if(arr.length===lines.length)return arr;}
  }catch(e){}
  return DEFAULT_TIMES.slice();
}

let times=loadTimes();
lines.forEach((l,i)=>l.t=times[i]);

/* ──────────────────────────────────────────────────────
   BUILD SLIDESHOW DOM
──────────────────────────────────────────────────────*/
const slideshowEl=document.getElementById('slideshow');
const dotsEl=document.getElementById('dots');

photos.forEach(p=>{
  const slide=document.createElement('div');slide.className='slide';
  const blur=document.createElement('div');blur.className='slide-blur';
  blur.style.backgroundImage=`url("${p.file}")`;
  const photo=document.createElement('div');photo.className='slide-photo';
  photo.style.backgroundImage=`url("${p.file}")`;
  photo.style.backgroundSize=p.type==='contain'?'contain':'cover';
  photo.style.backgroundPosition=p.pos;
  const vig=document.createElement('div');vig.className='slide-vignette';
  slide.append(blur,photo,vig);slideshowEl.appendChild(slide);
  const dot=document.createElement('div');dot.className='dot';dotsEl.appendChild(dot);
});

/* ──────────────────────────────────────────────────────
   STATE
──────────────────────────────────────────────────────*/
let curSlide=0, curLine=-1, rafId=null, slideTimer=null;
const SLIDE_MS=7200;

const slides=document.querySelectorAll('.slide');
const dots=document.querySelectorAll('.dot');
const song=document.getElementById('song');
const playPath=document.getElementById('play-path');
const eraBadge=document.getElementById('era-badge');
const counter=document.getElementById('counter');
const pBar=document.getElementById('progress-bar');
const karaokeEl=document.getElementById('karaoke');
const klines=karaokeEl.querySelectorAll('.kline');
const PLAY="M8 5v14l11-7z",PAUSE="M6 19h4V5H6v14zm8-14v14h4V5h-4z";

/* ──────────────────────────────────────────────────────
   KEN BURNS
──────────────────────────────────────────────────────*/
function fireKenBurns(i){
  const ph=slides[i].querySelector('.slide-photo');
  ph.style.animation='none';void ph.offsetWidth;
  ph.style.animation=`${photos[i].kb} 9s ease-out forwards`;
}

/* ──────────────────────────────────────────────────────
   SLIDE
──────────────────────────────────────────────────────*/
function isDesignCard(i){ return photos[i].kb==='kbCard'; }

function showSlide(n){
  slides[curSlide].classList.remove('active');dots[curSlide].classList.remove('active');
  curSlide=((n%photos.length)+photos.length)%photos.length;
  slides[curSlide].classList.add('active');dots[curSlide].classList.add('active');
  fireKenBurns(curSlide);
  eraBadge.classList.remove('fade-in');eraBadge.classList.add('fade-out');
  setTimeout(()=>{eraBadge.textContent=photos[curSlide].era;
    eraBadge.classList.remove('fade-out');eraBadge.classList.add('fade-in');},480);
  counter.textContent=`${curSlide+1} / ${photos.length}`;
  /* hide lyrics on the designed opening/closing cards */
  karaokeEl.style.opacity=isDesignCard(curSlide)?'0':'1';
  karaokeEl.style.pointerEvents=isDesignCard(curSlide)?'none':'auto';
}

/* ── Slide timer — pauses and resumes with audio ──── */
function startSlideTimer(){
  if(slideTimer)return;
  slideTimer=setInterval(()=>showSlide(curSlide+1),SLIDE_MS);
}
function stopSlideTimer(){
  if(slideTimer){clearInterval(slideTimer);slideTimer=null;}
}

/* ──────────────────────────────────────────────────────
   KARAOKE WINDOW — 5 visible slots: past2,past1,current,next1,next2
──────────────────────────────────────────────────────*/
const STATES=['past-2','past-1','current','next-1','next-2'];

function renderKaraoke(activeLine){
  /* activeLine = index into lines[], or -1 for blank */
  const indices=[activeLine-2,activeLine-1,activeLine,activeLine+1,activeLine+2];
  klines.forEach((kl,slot)=>{
    const li=indices[slot];
    const lineObj=(li>=0&&li<lines.length)?lines[li]:null;
    const state=lineObj?STATES[slot]:'hidden';
    kl.dataset.state=state;
    kl.classList.toggle('refrain',lineObj?lineObj.r:false);
    kl.querySelector('.ktext').textContent=lineObj?lineObj.txt:' ';
    /* reset sweep */
    kl.querySelector('.ktext').style.setProperty('--fill','0%');
  });
}

/* ──────────────────────────────────────────────────────
   SWEEP — driven by song.currentTime so it pauses with audio.
   Slide navigation has zero effect on lyrics.
──────────────────────────────────────────────────────*/
function updateSweep(){
  if(curLine<0||curLine>=lines.length)return;
  const ct=song.currentTime;
  const lineStart=lines[curLine].t;
  const lineEnd=lines[curLine+1]?lines[curLine+1].t:lineStart+5;
  const pct=Math.min((ct-lineStart)/(lineEnd-lineStart)*100,100);
  const cur=karaokeEl.querySelector('.kline[data-state="current"] .ktext');
  if(cur)cur.style.setProperty('--fill',pct+'%');
}

/* ──────────────────────────────────────────────────────
   MAIN KARAOKE LOOP — rAF polls audio currentTime.
   Lyrics respond ONLY to audio play/pause; slides are independent.
──────────────────────────────────────────────────────*/
function karaokeLoop(){
  if(!song.paused){
    const ct=song.currentTime;
    let newLine=-1;
    for(let i=0;i<lines.length;i++){if(lines[i].t<=ct)newLine=i;else break;}
    if(newLine!==curLine){curLine=newLine;renderKaraoke(curLine);}
    updateSweep();
  }
  rafId=requestAnimationFrame(karaokeLoop);
}

/* ──────────────────────────────────────────────────────
   START
──────────────────────────────────────────────────────*/
function startPresentation(){
  document.getElementById('start-screen').classList.add('hidden');
  slides[0].classList.add('active');dots[0].classList.add('active');
  fireKenBurns(0);
  eraBadge.textContent=photos[0].era;counter.textContent=`1 / ${photos.length}`;
  renderKaraoke(-1);
  /* opening card — hide lyrics until a photo slide appears */
  karaokeEl.style.opacity='0';karaokeEl.style.pointerEvents='none';
  song.play().catch(()=>{});playPath.setAttribute('d',PAUSE);
  startSlideTimer();
  rafId=requestAnimationFrame(karaokeLoop);
}

function toggleAudio(e){
  e.stopPropagation();
  if(song.paused){
    song.play();playPath.setAttribute('d',PAUSE);
    startSlideTimer();
    if(!rafId)rafId=requestAnimationFrame(karaokeLoop);
  }else{
    song.pause();playPath.setAttribute('d',PLAY);
    stopSlideTimer();
  }
}

song.addEventListener('timeupdate',()=>{
  if(song.duration)pBar.style.width=(song.currentTime/song.duration*100)+'%';
});
song.addEventListener('ended',()=>{
  playPath.setAttribute('d',PLAY);
  stopSlideTimer();
  if(rafId)cancelAnimationFrame(rafId);rafId=null;
  /* Show finale card */
  setTimeout(()=>{
    const f=document.getElementById('finale');
    f.style.display='flex';
    requestAnimationFrame(()=>f.classList.add('active'));
  },1200);
});
/* click finale to dismiss */
document.getElementById('finale').addEventListener('click',()=>{
  document.getElementById('finale').classList.remove('active');
  setTimeout(()=>document.getElementById('finale').style.display='none',1500);
});

/* position era badge below header */
function positionEra(){
  const h=document.getElementById('header').getBoundingClientRect().bottom;
  eraBadge.style.top=(h+8)+'px';
}
positionEra();window.addEventListener('resize',positionEra);

/* ──────────────────────────────────────────────────────
   CALIBRATION MODE
──────────────────────────────────────────────────────*/
let calibMode=false,calibIdx=0,calibNewTimes=[];

function openCalib(){
  calibMode=true;calibIdx=0;calibNewTimes=[];
  song.currentTime=0;song.play().catch(()=>{});
  playPath.setAttribute('d',PAUSE);
  updateCalibUI();
  document.getElementById('calib-overlay').classList.add('active');
}
function closeCalib(){
  calibMode=false;
  document.getElementById('calib-overlay').classList.remove('active');
}
function calibCancel(){closeCalib();}
function calibRestart(){calibIdx=0;calibNewTimes=[];song.currentTime=0;updateCalibUI();}
function calibTap(){
  if(calibIdx>=lines.length){calibSave();return;}
  calibNewTimes[calibIdx]=parseFloat(song.currentTime.toFixed(2));
  calibIdx++;
  updateCalibUI();
  if(calibIdx>=lines.length)calibSave();
}
function updateCalibUI(){
  const cur=lines[calibIdx]||null;
  const nxt=lines[calibIdx+1]||null;
  document.getElementById('calib-current').textContent=cur?`"${cur.txt}"`:'— Listo —';
  document.getElementById('calib-next').textContent=nxt?`A continuación: "${nxt.txt}"`:'';
  document.getElementById('calib-progress').textContent=`${calibIdx} / ${lines.length}`;
}
function calibSave(){
  if(calibNewTimes.length===lines.length){
    times=calibNewTimes.slice();
    lines.forEach((l,i)=>l.t=times[i]);
    try{localStorage.setItem('kara_times',JSON.stringify(times));}catch(e){}
  }
  closeCalib();
}

/* ──────────────────────────────────────────────────────
   INPUT
──────────────────────────────────────────────────────*/
document.body.addEventListener('click',e=>{
  if(e.target.closest('#start-screen')||e.target.closest('#play-btn')||
     e.target.closest('#calib-overlay'))return;
  /* tap to advance slide manually */
  showSlide(curSlide+1);
});

document.addEventListener('keydown',e=>{
  if(e.key==='c'||e.key==='C'){
    calibMode?closeCalib():openCalib();return;
  }
  if(calibMode){
    if(e.key===' '){e.preventDefault();calibTap();}
    return;
  }
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();showSlide(curSlide+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();showSlide(curSlide-1);}
});

/* Touch swipe */
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>44)dx<0?showSlide(curSlide+1):showSlide(curSlide-1);
},{passive:true});
</script>

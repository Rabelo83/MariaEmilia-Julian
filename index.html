<style>
:root{
  --gold:#f0c060;
  --cream:#f5e6c8;
  --ink:#0b0907;
  --top:56px;
  --lh:clamp(2rem,6.4vh,4.6rem);
  --en:calc(var(--lh)*.52);
  --band:calc(var(--lh)*3 + var(--en) + 26px + env(safe-area-inset-bottom,0px));
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--cream);
  font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

/* ── Slides ───────────────────────────────────── */
#stage{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.8s ease-in-out;pointer-events:none}
.slide.on{opacity:1;z-index:2}
.slide.leaving{z-index:1}
.bg{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;
  filter:blur(38px) brightness(.34) saturate(1.25)}
.frame{position:absolute;left:0;right:0;top:var(--top);bottom:var(--band);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(6px,1.6vh,18px) clamp(14px,3vw,48px)}
.ph{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;
  box-shadow:0 0 0 1px rgba(255,255,255,.10),0 18px 60px rgba(0,0,0,.65);
  will-change:transform}
.slide.on .ph,.slide.leaving .ph{animation:zoomIn 20s linear forwards}
.slide.alt.on .ph,.slide.alt.leaving .ph{animation-name:zoomOut}
body.paused .ph{animation-play-state:paused}
@keyframes zoomIn {from{transform:scale(1)}    to{transform:scale(1.05)}}
@keyframes zoomOut{from{transform:scale(1.05)} to{transform:scale(1)}}

#shade{position:fixed;left:0;right:0;bottom:0;height:calc(var(--band) + 60px);z-index:5;pointer-events:none;
  background:linear-gradient(to bottom,rgba(11,9,7,0),rgba(11,9,7,.78) 45%,rgba(11,9,7,.94))}

/* ── Top bar ──────────────────────────────────── */
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:rgba(255,255,255,.07)}
#bar i{display:block;height:100%;width:0;background:var(--gold)}
#top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:20;
  display:flex;align-items:center;justify-content:flex-end;gap:10px;
  padding:env(safe-area-inset-top,0px) clamp(14px,3vw,32px) 0}
#top button{flex:none;width:44px;height:44px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(240,192,96,.45);background:rgba(11,9,7,.45);
  display:flex;align-items:center;justify-content:center}
#top button svg{width:18px;height:18px;fill:var(--gold)}
#full[hidden]{display:none}
#top #again{display:none;width:auto;padding:0 18px;border-radius:22px;
  font:400 .72rem 'Lato',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
body.ended #top #again{display:flex}
#top button:focus-visible,#go:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ── Lyrics ───────────────────────────────────── */
#lyrics{position:fixed;left:0;right:0;z-index:10;pointer-events:none;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  height:calc(var(--lh)*3 + var(--en));overflow:hidden;transition:opacity .9s ease}
#lyrics.idle{opacity:0}
#roll{transition:transform .55s cubic-bezier(.3,.7,.2,1);will-change:transform}
.ln{display:flex;flex-direction:column;align-items:center;
  opacity:0;transition:opacity .5s ease}
.ln.near{opacity:.42}
.ln.cur{opacity:1}
.ln span{display:inline-flex;align-items:center;height:var(--lh);white-space:nowrap;
  font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
  font-size:min(calc(var(--lh)*.66),6.3vw);line-height:1;padding:0 .1em;
  transform:scale(.74);transition:transform .55s cubic-bezier(.3,.7,.2,1);
  background:linear-gradient(90deg,var(--gold) var(--fill,0%),var(--cream) var(--fill,0%));
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.9))}
.ln.cur span{transform:scale(1)}
.en{font:400 min(max(11px,calc(var(--lh)*.3)),3.8vw)/1.2 'Lato',sans-serif;letter-spacing:.05em;
  color:rgba(245,230,200,.72);text-shadow:0 1px 5px rgba(0,0,0,.9)}
.ln .en{height:0;opacity:0;overflow:hidden;white-space:nowrap;
  transition:height .55s cubic-bezier(.3,.7,.2,1),opacity .5s ease}
.ln.cur .en{height:var(--en);opacity:1}

/* ── Closing dedication ───────────────────────── */
#ded{position:fixed;left:0;right:0;z-index:10;pointer-events:none;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));height:calc(var(--lh)*3 + var(--en));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;
  text-align:center;padding:0 16px;opacity:0;transform:translateY(8px);
  transition:opacity 1.8s ease,transform 1.8s ease}
body.outro #ded{opacity:1;transform:none}
#ded .more{margin-top:.5em;font:italic 400 min(calc(var(--lh)*.56),4.8vw)/1.1 'Cormorant Garamond',Georgia,serif;
  color:var(--gold);opacity:0;transition:opacity 1.8s ease;text-shadow:0 2px 8px rgba(0,0,0,.9)}
#ded .more-en{opacity:0;transition:opacity 1.8s ease}
body.outro2 #ded .more,body.outro2 #ded .more-en{opacity:1}
#ded .to{font:italic 500 min(calc(var(--lh)*.62),5.6vw)/1.1 'Cormorant Garamond',Georgia,serif;
  color:var(--cream);text-shadow:0 2px 8px rgba(0,0,0,.9)}

/* ── Start screen ─────────────────────────────── */
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.2vh,22px);text-align:center;padding:24px;background:var(--ink);
  transition:opacity 1.2s ease,visibility 1.2s}
#start.gone{opacity:0;visibility:hidden}
#start .bg{z-index:0}
#start>*:not(.bg){position:relative;z-index:1}
#poster{max-height:46vh;max-width:min(78vw,340px);border-radius:8px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 20px 60px rgba(0,0,0,.7)}
#start .names{font-size:clamp(.66rem,1.6vw,1rem);letter-spacing:.38em;text-transform:uppercase;color:rgba(240,192,96,.8)}
#start h1{font:400 clamp(2rem,7.5vw,4.2rem)/1.05 'Cormorant Garamond',Georgia,serif;color:var(--cream);text-wrap:balance}
#start .sub{font:italic 400 clamp(1rem,3vw,1.9rem) 'Cormorant Garamond',Georgia,serif;color:var(--gold)}
#start .more{font-size:clamp(.66rem,1.6vw,1.05rem);letter-spacing:.34em;text-transform:uppercase;color:var(--cream)}
#start .en{margin-top:calc(clamp(10px,2.2vh,22px)*-.7)}
#go{min-height:50px;padding:0 40px;margin-top:6px;cursor:pointer;display:inline-flex;align-items:center;gap:12px;
  font:400 .8rem 'Lato',sans-serif;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ink);background:var(--gold);border:0;border-radius:2px}
#go svg{width:12px;height:12px;fill:currentColor}

@media (max-height:520px){
  :root{--top:46px}
  #poster{display:none}
  #top button{width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){
  .slide.on .ph,.slide.leaving .ph{animation:none}
}
</style>
</head>
<body class="paused">

<div id="stage"></div>
<div id="shade"></div>

<div id="bar"><i></i></div>
<div id="top">
  <button id="again">↺&nbsp; Repetir</button>
  <button id="play" aria-label="Reproducir o pausar">
    <svg viewBox="0 0 24 24"><path id="icon" d="M8 5v14l11-7z"/></svg>
  </button>
  <button id="full" aria-label="Pantalla completa" hidden>
    <svg viewBox="0 0 24 24"><path id="fsicon" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
  </button>
</div>

<div id="lyrics" class="idle" aria-live="off"><div id="roll"></div></div>
<div id="ded"><div class="to" lang="es">Para María Emilia, con todo mi amor</div><div class="en" lang="en">For María Emilia, with all my love</div><div class="more" lang="es">Y la historia continúa…</div><div class="en more-en" lang="en">And the story continues…</div></div>

<div id="start">
  <img class="bg" src="16-54-aniversario.jpeg" alt="">
  <img id="poster" src="16-54-aniversario.jpeg" alt="Julián y María Emilia, 54 Aniversario">
  <div class="names">Julián &amp; María Emilia</div>
  <h1>Todo lo cosechado</h1>
  <div class="en" lang="en">All That We Have Harvested</div>
  <div class="sub">54 Aniversario · 1972 – 2026</div>
  <div class="more">… y seguimos contando</div>
  <div class="en" lang="en">… and still counting</div>
  <button id="go"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Comenzar</button>
</div>

<audio id="song" preload="auto" src="Todo%20lo%20cosechado.mp3"></audio>

<script>
const PHOTOS=[
  ["01-nuestro-matrimonio.jpeg",  "Nuestro matrimonio"],
  ["02-maria-emilia-retrato.jpeg","María Emilia · Cuba"],
  ["03-noviazgo-banca.jpeg",      "Días de noviazgo"],
  ["04-noviazgo-palmeras.jpeg",   "Días de noviazgo"],
  ["05-noviazgo-habana.jpeg",     "Noviazgo en La Habana"],
  ["06-novia-espejo.jpeg",        "El día de la boda · 1972"],
  ["07-ceremonia-civil.jpeg",     "La ceremonia civil"],
  ["08-firma-acta.jpeg",          "La firma del acta"],
  ["09-intercambio-anillos.jpeg", "El intercambio de anillos"],
  ["10-escalera-juntos.jpeg",     "¡Recién casados!"],
  ["11-auto-novios.jpeg",         "Partiendo juntos"],
  ["12-anos-setenta.jpeg",        "Años setenta"],
  ["13-familia-sacerdote.jpeg",   "En familia"],
  ["14-playa-familia.jpeg",       "Playa en familia"],
  ["15-hoy-lobby.jpeg",           "Hoy · 2026"],
  ["16-54-aniversario.jpeg",      "54 Aniversario"],
];

/* [inicio, fin, español, english] — tiempos en segundos de la canción */
const LINES=[
  [14.62,17.60,"María Emilia y yo, somos","Mar\u00eda Emilia and I, we are"],
  [17.60,21.96,"De un poema, dos versos,","Two verses of one poem,"],
  [21.96,25.12,"Somos portadas, reversos","We are the covers, front and back,"],
  [25.44,29.02,"De libros en varios tomos.","Of books in many volumes."],
  [29.96,32.68,"Somos tapa, somos pomos","We are the lid, we are the jars"],
  [33.20,36.02,"de todo lo elaborado,","Of everything we have made,"],
  [36.62,39.72,"Como un cofre resguardado","Like a well-guarded chest"],
  [39.86,41.56,"Con amor bien protegido,","With love kept safe inside,"],
  [41.72,43.38,"Con amor se ha recogido,","With love we have gathered"],
  [43.38,45.08,"Todo lo cosechado.","All that we have harvested."],

  [51.96,54.06,"Somos polos diferentes","We are opposite poles,"],
  [55.16,58.14,"Por ello, hay atracción","That is why there is attraction,"],
  [59.32,61.68,"Somos acción, reacción","We are action, reaction,"],
  [62.30,66.18,"Somos dos conectadas mentes.","We are two connected minds."],
  [66.96,69.60,"Somos dos almas pacientes","We are two patient souls,"],
  [70.38,73.12,"Orgullosas de un pasado","Proud of a past"],
  [74.37,76.74,"Que con el amor pactado","That, with the love we pledged"],
  [76.74,78.58,"En aquel día elegido","On that chosen day,"],
  [78.58,80.44,"Con amor se ha recogido","With love we have gathered"],
  [80.44,82.24,"Todo lo cosechado.","All that we have harvested."],

  [89.52,91.56,"Somos las alas en par","We are a pair of wings"],
  [93.08,95.16,"Sosteniendo un corazón","Holding up one heart,"],
  [96.86,98.86,"Componemos la razón,","Together we are the reason"],
  [99.32,102.44,"De una generación crear.","A new generation came to be."],
  [103.62,106.60,"Tronco y rama, nuevo hogar","Trunk and branch, a new home"],
  [107.58,109.88,"Que nació en el pasado","That was born in the past,"],
  [111.00,113.70,"Riberas y un río dado","Riverbanks and a river given"],
  [113.70,115.62,"En un largo recorrido","Along a long journey,"],
  [115.62,117.46,"Con amor se ha recogido","With love we have gathered"],
  [117.46,119.40,"Todo lo cosechado.","All that we have harvested."],

  [134.26,137.26,"Agua dulce, agua salada","Fresh water, salt water"],
  [137.28,140.50,"En el umbral de la unión","At the threshold of our union,"],
  [141.24,144.18,"Salvando la situación,","Finding a way through things"],
  [144.18,148.30,"A veces, tan complicada.","That were, at times, so hard."],
  [148.64,150.82,"Experiencia acumulada","Experience gathered"],
  [150.82,154.58,"En eventos del pasado,","From all that came before,"],
  [155.18,158.04,"Hoy, aquí hemos llegado","Today, here we have arrived"],
  [158.20,160.06,"Recordando lo vivido","Remembering what we lived,"],
  [160.06,161.82,"Con amor se ha recogido","With love we have gathered"],
  [161.82,163.66,"Todo lo cosechado.","All that we have harvested."],

  [164.18,167.34,"Gracias a Dios, por la vida","Thank God for the life"],
  [167.34,171.44,"Que juntos hemos vivido","We have lived together,"],
  [171.44,174.88,"Gracias a Dios, por Cupido","Thank God for Cupid,"],
  [174.88,178.30,"Del flechazo y la herida.","For the arrow and the wound."],
  [179.44,182.28,"Gracias por la bendecida","Thank you for the blessed"],
  [182.50,185.92,"Familia que hemos creado","Family we have created,"],
  [186.44,189.74,"Gracias por haber llegado","Thank you for having reached"],
  [189.74,192.66,"A otro año más, cumplido","One more year, fulfilled,"],
  [193.04,195.02,"Con amor se ha recogido","With love we have gathered"],
  [195.02,198.30,"Todo lo cosechado.","All that we have harvested."],
];

const $=id=>document.getElementById(id);
const song=$('song'), stage=$('stage'), roll=$('roll'), lyrics=$('lyrics');
const PLAY="M8 5v14l11-7z", PAUSE="M6 19h4V5H6v14zm8-14v14h4V5h-4z";

/* ── Build DOM ── */
PHOTOS.forEach(([f],i)=>{
  const s=document.createElement('div');
  s.className='slide'+(i%2?' alt':'');
  s.innerHTML=`<img class="bg" src="${f}" alt=""><div class="frame"><img class="ph" src="${f}" alt=""></div>`;
  stage.appendChild(s);
});
const slides=[...stage.children];
LINES.forEach(([, ,es,en])=>{
  const d=document.createElement('div');d.className='ln';
  const sp=document.createElement('span');sp.textContent=es;sp.lang='es';
  const tr=document.createElement('div');tr.className='en';tr.textContent=en;tr.lang='en';
  d.append(sp,tr);roll.appendChild(d);
});
const lns=[...roll.children];

/* ── Slide schedule, tied to song time: opening card over the intro,
      closing card lands on the final refrain ── */
const OPEN_END=Math.max(5,LINES[0][0]-1);
const CLOSE_START=LINES[LINES.length-2][0]-0.6;
const STEP=(CLOSE_START-OPEN_END)/(PHOTOS.length-2);
const scheduled=t=>t<OPEN_END?0:t>=CLOSE_START?PHOTOS.length-1:1+Math.floor((t-OPEN_END)/STEP);

const DEDICATION_AT=LINES[LINES.length-1][1]+1.5, CONTINUES_AT=DEDICATION_AT+2.6;

let cur=-1, sched=-1, lineIdx=-2;
function show(n){
  n=(n+PHOTOS.length)%PHOTOS.length;
  if(n===cur)return;
  const old=slides[cur];
  if(old){old.classList.remove('on');old.classList.add('leaving');setTimeout(()=>old.classList.remove('leaving'),1900);}
  slides[n].classList.remove('leaving');slides[n].classList.add('on');
  cur=n;
}

/* ── Lyrics follow song.currentTime only ── */
function setLine(i){
  lineIdx=i;
  const shown=Math.max(i,0);
  lns.forEach((el,k)=>{
    el.className='ln'+(k===shown?' cur':Math.abs(k-shown)===1?' near':'');
    el.firstChild.style.setProperty('--fill',k<i?'100%':'0%');
  });
  roll.style.transform=`translateY(calc(var(--lh)*${1-shown}))`;
}
function tick(){
  const t=song.currentTime;
  const s=scheduled(t);
  if(s!==sched){sched=s;show(s);}

  let i=-1;
  while(i+1<LINES.length&&LINES[i+1][0]<=t)i++;
  if(i!==lineIdx)setLine(i);
  if(i>=0){
    const [a,b]=LINES[i];
    lns[i].firstChild.style.setProperty('--fill',Math.max(0,Math.min(1,(t-a)/(b-a)))*100+'%');
  }
  const next=LINES[i+1];
  const waiting=i<0?LINES[0][0]-t>3:(t>LINES[i][1]+2.5&&(!next||next[0]-t>3));
  lyrics.classList.toggle('idle',waiting);
  document.body.classList.toggle('outro',t>=DEDICATION_AT);
  document.body.classList.toggle('outro2',t>=CONTINUES_AT);

  if(song.duration)$('bar').firstChild.style.width=(t/song.duration*100)+'%';
  requestAnimationFrame(tick);
}

/* ── Controls ── */
function setPlaying(p){
  document.body.classList.toggle('paused',!p);
  $('icon').setAttribute('d',p?PAUSE:PLAY);
}
function toggle(){ song.paused?song.play():song.pause(); }
song.addEventListener('play', ()=>{document.body.classList.remove('ended');setPlaying(true);});
song.addEventListener('ended',()=>document.body.classList.add('ended'));
song.addEventListener('pause',()=>setPlaying(false));

let started=false;
$('go').addEventListener('click',()=>{
  started=true;
  $('start').classList.add('gone');
  song.currentTime=0;song.play();
});
$('play').addEventListener('click',e=>{e.stopPropagation();toggle();});
$('again').addEventListener('click',e=>{e.stopPropagation();song.currentTime=0;song.play();});

/* Full screen (hidden where the browser does not support it, e.g. iPhone) */
const root=document.documentElement;
const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
const FS_IN="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z";
const FS_OUT="M8 4h2v6H4V8h4V4zm6 0h2v4h4v2h-6V4zM4 14h6v6H8v-4H4v-2zm10 0h6v2h-4v4h-2v-6z";
function fullscreen(){
  if(fsOn())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else (root.requestFullscreen||root.webkitRequestFullscreen).call(root);
}
if(root.requestFullscreen||root.webkitRequestFullscreen){
  $('full').hidden=false;
  $('full').addEventListener('click',e=>{e.stopPropagation();fullscreen();});
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
    document.addEventListener(ev,()=>$('fsicon').setAttribute('d',fsOn()?FS_OUT:FS_IN)));
}

/* Manual photo browsing never touches the lyrics */
stage.addEventListener('click',e=>{ if(started)show(cur+(e.clientX<innerWidth/3?-1:1)); });
let tx=null;
stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',e=>{
  if(tx===null||!started)return;
  const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>40){show(cur+(dx<0?1:-1));e.preventDefault();}
});
document.addEventListener('keydown',e=>{
  if(!started)return;
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight')show(cur+1);
  else if(e.key==='ArrowLeft')show(cur-1);
  else if((e.key==='f'||e.key==='F')&&!$('full').hidden)fullscreen();
});

setLine(-1);
requestAnimationFrame(tick);
</script>
</body>
</html>

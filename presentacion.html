<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Todo lo Cosechado · Julián &amp; María Emilia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@200;300;400&display=swap" rel="stylesheet">
<style>

/* ─────────────────────────────────────────────────────────
   RESET & BASE
───────────────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%; overflow:hidden;
  background:#000;
  font-family:'Lato', sans-serif;
  color:#f5e6c8;
  -webkit-font-smoothing:antialiased;
  touch-action:pan-y;
}

/* ─────────────────────────────────────────────────────────
   KEN BURNS — 6 varieties + card
───────────────────────────────────────────────────────── */
@keyframes kb1 { 0%{transform:scale(1)   translate(0,0)}      100%{transform:scale(1.10) translate(-1.5%, 0.5%)} }
@keyframes kb2 { 0%{transform:scale(1)   translate(0,0)}      100%{transform:scale(1.10) translate( 1.5%,-0.5%)} }
@keyframes kb3 { 0%{transform:scale(1.08)translate(-1%,0)}    100%{transform:scale(1.16) translate( 1%, 0)}      }
@keyframes kb4 { 0%{transform:scale(1.12)translate(0,-0.5%)}  100%{transform:scale(1.02) translate( 0,  0.5%)}  }
@keyframes kb5 { 0%{transform:scale(1)   translate(1.5%,-1%)} 100%{transform:scale(1.12) translate(-1%,  1%)}   }
@keyframes kb6 { 0%{transform:scale(1.1) translate(0, 1%)}    100%{transform:scale(1.02) translate( 0, -1%)}    }
@keyframes kbCard { 0%{transform:scale(0.97)} 100%{transform:scale(1.03)} }

/* ─────────────────────────────────────────────────────────
   SLIDESHOW
───────────────────────────────────────────────────────── */
#slideshow { position:fixed; inset:0; z-index:0; }

.slide {
  position:absolute; inset:0;
  opacity:0;
  transition:opacity 2.2s ease-in-out;
  overflow:hidden;
}
.slide.active { opacity:1; z-index:2; }

/* Blurred atmospheric fill */
.slide-blur {
  position:absolute; inset:-6%;
  background-size:cover; background-position:center;
  filter:blur(32px) brightness(0.28) saturate(1.6);
  transform:scale(1.1);
  will-change:transform;
}

/* Sharp photo */
.slide-photo {
  position:absolute; inset:0;
  background-repeat:no-repeat;
  will-change:transform;
}

/* Cinematic vignette */
.slide-vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse 85% 85% at 50% 50%,
    transparent 40%, rgba(0,0,0,0.42) 100%);
  pointer-events:none;
}

/* ─────────────────────────────────────────────────────────
   GLOBAL OVERLAYS
───────────────────────────────────────────────────────── */
#gradient-overlay {
  position:fixed; inset:0; z-index:10; pointer-events:none;
  background:
    linear-gradient(to bottom,
      rgba(0,0,0,0.30)  0%,
      transparent       28%,
      transparent       52%,
      rgba(0,0,0,0.55)  72%,
      rgba(0,0,0,0.92) 100%);
}

/* ─────────────────────────────────────────────────────────
   PROGRESS BAR
───────────────────────────────────────────────────────── */
#progress-bar {
  position:fixed; top:0; left:0; height:2px; z-index:50;
  background:linear-gradient(90deg, #c89a30, #f0c060, #c89a30);
  width:0%;
  transition:width 0.6s linear;
  box-shadow:0 0 8px rgba(240,192,96,0.5);
}

/* ─────────────────────────────────────────────────────────
   HEADER
───────────────────────────────────────────────────────── */
#header {
  position:fixed; top:0; left:0; right:0; z-index:30;
  padding: env(safe-area-inset-top, 0px) 0 0;
  display:flex; align-items:center; justify-content:space-between;
  padding-left:clamp(16px,4vw,36px);
  padding-right:clamp(16px,4vw,36px);
  padding-top:calc(env(safe-area-inset-top, 0px) + 16px);
}

#title-text {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(0.78rem,1.6vw,1.3rem);
  font-weight:300; letter-spacing:0.06em;
  color:rgba(245,230,200,0.6);
  text-shadow:0 1px 10px rgba(0,0,0,1);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  margin-right:12px;
}
#title-text em { font-style:italic; color:rgba(240,192,96,0.85); font-weight:400; }

/* ─────────────────────────────────────────────────────────
   ERA BADGE
───────────────────────────────────────────────────────── */
#era-badge {
  position:fixed; z-index:30;
  /* repositioned for mobile below */
  left:clamp(16px,4vw,36px);
  font-size:clamp(0.6rem,1.1vw,0.68rem);
  font-weight:300; letter-spacing:0.26em;
  text-transform:uppercase;
  color:rgba(240,192,96,0.65);
  text-shadow:0 1px 8px rgba(0,0,0,1);
  transition:opacity 0.6s ease, transform 0.6s ease;
}
#era-badge.fade-out { opacity:0; transform:translateX(-10px); }
#era-badge.fade-in  { opacity:1; transform:translateX(0); }

/* ─────────────────────────────────────────────────────────
   PLAY BUTTON
───────────────────────────────────────────────────────── */
#play-btn {
  min-width:44px; width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(240,192,96,0.35);
  background:rgba(240,192,96,0.07);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
  transition:background 0.3s, border-color 0.3s, transform 0.2s;
  -webkit-tap-highlight-color:transparent;
}
#play-btn:hover, #play-btn:active {
  background:rgba(240,192,96,0.2);
  border-color:rgba(240,192,96,0.65);
  transform:scale(1.1);
}
#play-btn svg { width:17px; height:17px; fill:#f0c060; }

/* ─────────────────────────────────────────────────────────
   LYRICS
───────────────────────────────────────────────────────── */
#lyrics {
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left:clamp(14px,8vw,140px);
  padding-right:clamp(14px,8vw,140px);
  text-align:center;
}

.verse { display:none; }
.verse.active { display:block; }

.verse-line {
  display:block;
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(0.95rem,2vw,1.55rem);
  font-weight:300; line-height:1.5;
  color:rgba(245,230,200,0.95);
  text-shadow:
    0 1px 4px  rgba(0,0,0,1),
    0 2px 20px rgba(0,0,0,0.9),
    0 0  40px  rgba(0,0,0,0.6);
  opacity:0; transform:translateY(12px);
  animation:lineReveal 0.7s cubic-bezier(0.22,0.61,0.36,1) forwards;
}
.verse-line.refrain {
  color:#f0c060;
  font-style:italic; font-weight:400;
  font-size:clamp(1rem,2.2vw,1.7rem);
  letter-spacing:0.02em;
  filter:drop-shadow(0 0 12px rgba(240,192,96,0.3));
}

@keyframes lineReveal {
  to { opacity:1; transform:translateY(0); }
}

/* Stagger per line — only while .active */
.verse.active .verse-line:nth-child(1)  { animation-delay:0.05s; }
.verse.active .verse-line:nth-child(2)  { animation-delay:0.22s; }
.verse.active .verse-line:nth-child(3)  { animation-delay:0.39s; }
.verse.active .verse-line:nth-child(4)  { animation-delay:0.56s; }
.verse.active .verse-line:nth-child(5)  { animation-delay:0.73s; }
.verse.active .verse-line:nth-child(6)  { animation-delay:0.90s; }
.verse.active .verse-line:nth-child(7)  { animation-delay:1.07s; }
.verse.active .verse-line:nth-child(8)  { animation-delay:1.24s; }
.verse.active .verse-line:nth-child(9)  { animation-delay:1.44s; }
.verse.active .verse-line:nth-child(10) { animation-delay:1.64s; }

/* ─────────────────────────────────────────────────────────
   DOTS & COUNTER
───────────────────────────────────────────────────────── */
#dots {
  position:fixed; bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
  left:50%; transform:translateX(-50%);
  display:flex; gap:5px; z-index:35;
}
.dot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(255,255,255,0.18);
  transition:background 0.5s, transform 0.4s;
}
.dot.active { background:rgba(240,192,96,0.9); transform:scale(1.6); }

#counter {
  position:fixed; bottom:calc(env(safe-area-inset-bottom, 0px) + 36px);
  right:clamp(16px,4vw,36px); z-index:35;
  font-size:0.65rem; font-weight:200; letter-spacing:0.12em;
  color:rgba(245,230,200,0.28);
}

/* ─────────────────────────────────────────────────────────
   START SCREEN
───────────────────────────────────────────────────────── */
#start-screen {
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center; overflow:hidden;
  transition:opacity 1.4s ease;
  padding:clamp(24px,6vw,60px);
}
#start-screen.hidden { opacity:0; pointer-events:none; }

#start-bg {
  position:absolute; inset:-4%;
  background-image:url("10-escalera-juntos.jpeg");
  background-size:cover; background-position:center 12%;
  filter:brightness(0.22) blur(3px) saturate(1.2);
  transform:scale(1.05);
}

#start-screen::before {
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent, rgba(240,192,96,0.3), transparent);
}

#start-content { position:relative; z-index:2; max-width:600px; width:100%; }

.start-eyebrow {
  font-size:clamp(0.62rem,1.2vw,0.82rem);
  font-weight:200; letter-spacing:0.42em; text-transform:uppercase;
  color:rgba(240,192,96,0.55);
  margin-bottom:clamp(12px,2.5vh,20px);
}

#start-title {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(2.4rem,9vw,6rem);
  font-weight:300; line-height:1.0;
  color:#f5e6c8;
  text-shadow:0 4px 40px rgba(0,0,0,0.5);
  margin-bottom:8px;
}

#start-subtitle {
  font-family:'Cormorant Garamond', serif;
  font-style:italic;
  font-size:clamp(1.1rem,3.5vw,2.2rem);
  font-weight:300; color:#f0c060;
  letter-spacing:0.04em;
}

.start-divider {
  width:1px; height:clamp(32px,6vh,52px);
  background:linear-gradient(to bottom, transparent, rgba(240,192,96,0.4), transparent);
  margin:clamp(16px,3vh,24px) auto;
}

.start-year-block {
  font-size:clamp(0.72rem,1.4vw,0.92rem);
  font-weight:200; letter-spacing:0.3em;
  color:rgba(245,230,200,0.3);
  margin-bottom:clamp(28px,5vh,44px);
}
.start-year-block strong { font-weight:300; color:rgba(245,230,200,0.5); }

#start-btn {
  display:inline-flex; align-items:center; gap:10px;
  background:transparent;
  border:1px solid rgba(240,192,96,0.4);
  border-radius:2px;
  padding:clamp(12px,2vh,14px) clamp(28px,6vw,48px);
  font-family:'Lato', sans-serif;
  font-size:clamp(0.7rem,1.3vw,0.78rem);
  font-weight:300; letter-spacing:0.3em;
  text-transform:uppercase; color:rgba(240,192,96,0.8);
  cursor:pointer;
  transition:background 0.35s, border-color 0.35s, color 0.35s, transform 0.2s;
  -webkit-tap-highlight-color:transparent;
  min-height:48px; /* touch target */
}
#start-btn:hover, #start-btn:active {
  background:rgba(240,192,96,0.1);
  border-color:rgba(240,192,96,0.7);
  color:#f0c060;
}

.start-heart {
  display:block; margin:0 auto clamp(14px,3vh,24px);
  font-size:clamp(1.3rem,3vw,1.8rem); line-height:1;
  color:#c0392b;
  filter:drop-shadow(0 0 10px rgba(192,57,43,0.5));
  animation:heartbeat 2.6s infinite;
}
@keyframes heartbeat {
  0%,100%{transform:scale(1)}
  12%{transform:scale(1.22)}
  24%{transform:scale(1)}
  38%{transform:scale(1.14)}
  60%{transform:scale(1)}
}

/* ─────────────────────────────────────────────────────────
   MOBILE OVERRIDES  (≤ 500px wide)
───────────────────────────────────────────────────────── */
@media (max-width:500px) {

  /* hide era badge so it doesn't collide with header */
  #era-badge { display:none; }

  /* compact header title */
  #title-text { font-size:0.72rem; }

  /* fewer lyric lines visible — reduce padding, tight layout */
  #lyrics {
    padding-left:12px; padding-right:12px;
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .verse-line { font-size:0.92rem; line-height:1.45; }
  .verse-line.refrain { font-size:0.98rem; }

  /* hide dots on tiny screens */
  #dots { display:none; }
  #counter { display:none; }
}

/* Tablet / landscape phone adjustments */
@media (max-width:768px) and (orientation:portrait) {
  #era-badge { top:60px; font-size:0.6rem; }
}

@media (max-width:768px) and (orientation:landscape) {
  .verse-line { font-size:0.88rem; line-height:1.4; }
  .verse-line.refrain { font-size:0.94rem; }
  #lyrics { padding-bottom:12px; padding-left:8px; padding-right:8px; }
}

</style>
</head>
<body>

<div id="progress-bar"></div>
<div id="gradient-overlay"></div>

<!-- ── START SCREEN ───────────────────────────────────── -->
<div id="start-screen">
  <div id="start-bg"></div>
  <div id="start-content">
    <span class="start-heart">♥</span>
    <div class="start-eyebrow">Julián &amp; María Emilia</div>
    <div id="start-title">Todo lo cosechado</div>
    <div id="start-subtitle">54 Aniversario</div>
    <div class="start-divider"></div>
    <div class="start-year-block"><strong>1972</strong>&nbsp;—&nbsp;<strong>2026</strong></div>
    <button id="start-btn" onclick="startPresentation()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Comenzar
    </button>
  </div>
</div>

<!-- ── SLIDESHOW ─────────────────────────────────────── -->
<div id="slideshow"></div>

<!-- ── HEADER ───────────────────────────────────────── -->
<div id="header">
  <div id="title-text"><em>Todo lo cosechado</em>&nbsp;·&nbsp;Julián &amp; María Emilia</div>
  <div id="play-btn" onclick="toggleAudio(event)" title="Reproducir / Pausar">
    <svg viewBox="0 0 24 24"><path id="play-path" d="M8 5v14l11-7z"/></svg>
  </div>
</div>

<div id="era-badge" class="fade-in"></div>

<!-- ── LYRICS ────────────────────────────────────────── -->
<div id="lyrics"></div>

<!-- ── DOTS & COUNTER ───────────────────────────────── -->
<div id="dots"></div>
<div id="counter"></div>

<!-- ── AUDIO ─────────────────────────────────────────── -->
<audio id="song" preload="auto">
  <source src="Todo lo cosechado.mp3" type="audio/mpeg">
</audio>

<!-- ═══════════════════════════════════════════════════
     SCRIPT
════════════════════════════════════════════════════ -->
<script>
/* ── PHOTO DATA ────────────────────────────────────────
   type: 'cover'    → cover, custom pos (landscape/square)
         'portrait' → cover, face-high pos (tall photos)
         'contain'  → contain centred + blur visible (card art)
──────────────────────────────────────────────────────*/
const photos = [
  { file:"01-nuestro-matrimonio.jpeg",   era:"Nuestro Matrimonio",          type:"contain",  pos:"center center", kb:"kbCard" },
  { file:"02-maria-emilia-retrato.jpeg", era:"María Emilia · Cuba, ~1968",  type:"portrait", pos:"center 18%",    kb:"kb1"    },
  { file:"03-noviazgo-banca.jpeg",       era:"Días de noviazgo",            type:"cover",    pos:"center 42%",    kb:"kb2"    },
  { file:"04-noviazgo-palmeras.jpeg",    era:"Días de noviazgo",            type:"portrait", pos:"center 22%",    kb:"kb3"    },
  { file:"05-noviazgo-habana.jpeg",      era:"Noviazgo en La Habana",       type:"portrait", pos:"center 18%",    kb:"kb4"    },
  { file:"06-novia-espejo.jpeg",         era:"El día del matrimonio · 1972",type:"cover",    pos:"center 22%",    kb:"kb5"    },
  { file:"07-ceremonia-civil.jpeg",      era:"La ceremonia civil",          type:"cover",    pos:"center 50%",    kb:"kb6"    },
  { file:"08-firma-acta.jpeg",           era:"La firma del acta",           type:"cover",    pos:"center 54%",    kb:"kb1"    },
  { file:"09-intercambio-anillos.jpeg",  era:"El intercambio de anillos",   type:"cover",    pos:"center 44%",    kb:"kb2"    },
  { file:"10-escalera-juntos.jpeg",      era:"¡Recién casados!",            type:"portrait", pos:"center 12%",    kb:"kb3"    },
  { file:"11-auto-novios.jpeg",          era:"Partiendo juntos",            type:"cover",    pos:"center center", kb:"kb4"    },
  { file:"12-anos-setenta.jpeg",         era:"Años setenta",                type:"portrait", pos:"center 22%",    kb:"kb5"    },
  { file:"13-familia-sacerdote.jpeg",    era:"Años noventa · familia",      type:"cover",    pos:"center 40%",    kb:"kb6"    },
  { file:"14-playa-familia.jpeg",        era:"Playa en familia",            type:"cover",    pos:"center 48%",    kb:"kb1"    },
  { file:"15-hoy-lobby.jpeg",            era:"Hoy · 2026",                  type:"portrait", pos:"center 16%",    kb:"kb2"    },
  { file:"16-54-aniversario.jpeg",       era:"54 Aniversario · 2026",       type:"contain",  pos:"center center", kb:"kbCard" },
];

const verses = [
  { lines:["María Emilia y yo, somos","De un poema, dos versos,","Somos portadas, reversos","De libros en varios tomos.","Somos tapa, somos pomos","de todo lo elaborado,","Como un cofre resguardado","Con amor bien protegido,"], refrain:["Con amor se ha recogido,","Todo lo cosechado."] },
  { lines:["Somos polos diferentes","Por ello, hay atracción","Somos acción, reacción","Somos dos conectadas mentes.","Somos dos almas pacientes","Orgullosas de un pasado","Que con el amor pactado","En aquel día elegido"], refrain:["Con amor se ha recogido","Todo lo cosechado."] },
  { lines:["Somos las alas en par","Sosteniendo un corazón","Componemos la razón,","De una generación crear.","Tronco y rama, nuevo hogar","Que nació en el pasado","Riberas y un río dado","En un largo recorrido"], refrain:["Con amor se ha recogido","Todo lo cosechado."] },
  { lines:["Agua dulce, agua salada","En el umbral de la unión","Salvando la situación,","A veces, tan complicada.","Experiencia acumulada","En eventos del pasado,","Hoy, aquí hemos llegado","Recordando lo vivido"], refrain:["Con amor se ha recogido","Todo lo cosechado."] },
  { lines:["Gracias a Dios, por la vida","Que juntos hemos vivido","Gracias a Dios, por Cupido","Del flechazo y la herida.","Gracias por la bendecida","Familia que hemos creado","Gracias por haber llegado","A otro año más, cumplido"], refrain:["Con amor se ha recogido","Todo lo cosechado."] },
];

/* ── BUILD DOM ───────────────────────────────────────── */
const slideshowEl = document.getElementById('slideshow');
const dotsEl      = document.getElementById('dots');
const lyricsEl    = document.getElementById('lyrics');

photos.forEach((p) => {
  const slide = document.createElement('div');
  slide.className = 'slide';

  const blur = document.createElement('div');
  blur.className = 'slide-blur';
  blur.style.backgroundImage = `url("${p.file}")`;

  const photo = document.createElement('div');
  photo.className = 'slide-photo';
  photo.style.backgroundImage = `url("${p.file}")`;
  photo.style.backgroundSize     = p.type === 'contain' ? 'contain' : 'cover';
  photo.style.backgroundPosition = p.pos;

  const vig = document.createElement('div');
  vig.className = 'slide-vignette';

  slide.append(blur, photo, vig);
  slideshowEl.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dotsEl.appendChild(dot);
});

verses.forEach(v => {
  const div = document.createElement('div');
  div.className = 'verse';
  [...v.lines, ...v.refrain].forEach((txt, li) => {
    const p = document.createElement('p');
    p.className = 'verse-line' + (li >= v.lines.length ? ' refrain' : '');
    p.textContent = txt;
    div.appendChild(p);
  });
  lyricsEl.appendChild(div);
});

/* ── STATE ─────────────────────────────────────────── */
let cur      = 0;
let curVerse = 0;
const SLIDE_MS = 7200;
const VERSE_MS = 21600;

const slides   = document.querySelectorAll('.slide');
const dots     = document.querySelectorAll('.dot');
const verseEls = document.querySelectorAll('.verse');
const song     = document.getElementById('song');
const playPath = document.getElementById('play-path');
const eraBadge = document.getElementById('era-badge');
const counter  = document.getElementById('counter');
const pBar     = document.getElementById('progress-bar');
const PLAY  = "M8 5v14l11-7z";
const PAUSE = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

/* ── KEN BURNS ─────────────────────────────────────── */
function fireKenBurns(i) {
  const ph = slides[i].querySelector('.slide-photo');
  ph.style.animation = 'none';
  void ph.offsetWidth;
  ph.style.animation = `${photos[i].kb} 9s ease-out forwards`;
}

/* ── SHOW SLIDE ────────────────────────────────────── */
function showSlide(n) {
  slides[cur].classList.remove('active');
  dots[cur].classList.remove('active');
  cur = ((n % photos.length) + photos.length) % photos.length;
  slides[cur].classList.add('active');
  dots[cur].classList.add('active');
  fireKenBurns(cur);

  eraBadge.classList.remove('fade-in');
  eraBadge.classList.add('fade-out');
  setTimeout(() => {
    eraBadge.textContent = photos[cur].era;
    eraBadge.classList.remove('fade-out');
    eraBadge.classList.add('fade-in');
  }, 480);

  counter.textContent = `${cur + 1} / ${photos.length}`;
}

/* ── SHOW VERSE ────────────────────────────────────── */
function showVerse(n) {
  verseEls[curVerse].classList.remove('active');
  curVerse = ((n % verses.length) + verses.length) % verses.length;
  const v = verseEls[curVerse];
  v.querySelectorAll('.verse-line').forEach(el => {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  });
  v.classList.add('active');
}

/* ── START ─────────────────────────────────────────── */
function startPresentation() {
  document.getElementById('start-screen').classList.add('hidden');
  slides[0].classList.add('active');
  dots[0].classList.add('active');
  fireKenBurns(0);
  eraBadge.textContent = photos[0].era;
  counter.textContent  = `1 / ${photos.length}`;
  verseEls[0].classList.add('active');
  song.play().catch(() => {});
  playPath.setAttribute('d', PAUSE);
  setInterval(() => showSlide(cur + 1),      SLIDE_MS);
  setInterval(() => showVerse(curVerse + 1), VERSE_MS);
}

function toggleAudio(e) {
  e.stopPropagation();
  if (song.paused) { song.play();  playPath.setAttribute('d', PAUSE); }
  else             { song.pause(); playPath.setAttribute('d', PLAY);  }
}

song.addEventListener('timeupdate', () => {
  if (song.duration) pBar.style.width = (song.currentTime / song.duration * 100) + '%';
});
song.addEventListener('ended', () => playPath.setAttribute('d', PLAY));

/* ── POSITION ERA BADGE BELOW HEADER ───────────────── */
function positionEra() {
  const h = document.getElementById('header').getBoundingClientRect().bottom;
  eraBadge.style.top = (h + 8) + 'px';
}
positionEra();
window.addEventListener('resize', positionEra);

/* ── NAVIGATION ─────────────────────────────────────── */
document.body.addEventListener('click', e => {
  if (e.target.closest('#start-screen') || e.target.closest('#play-btn')) return;
  showSlide(cur + 1);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); showSlide(cur + 1); }
  if (e.key === 'ArrowLeft')                   { e.preventDefault(); showSlide(cur - 1); }
  if (e.key === 'ArrowDown')                   { e.preventDefault(); showVerse(curVerse + 1); }
  if (e.key === 'ArrowUp')                     { e.preventDefault(); showVerse(curVerse - 1); }
});

/* Touch swipe */
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 44) dx < 0 ? showSlide(cur + 1) : showSlide(cur - 1);
}, {passive:true});
</script>
</body>
